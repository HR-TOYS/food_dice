<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORACLE — Aurora D20</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f4efff;background:radial-gradient(ellipse 55% 42% at 50% 37%,#29205b 0%,transparent 75%),radial-gradient(ellipse at 15% 85%,#131938 0%,transparent 55%),#070812;display:grid;place-items:center;overflow-x:hidden}.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#c9bbff88 0.7px,transparent 1px);background-size:43px 47px;opacity:.23;mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 85%,transparent)}main{position:relative;width:min(94vw,680px);padding:38px 24px 30px;text-align:center}header .eyebrow{font-size:11px;letter-spacing:.42em;color:#ac9dcf;font-weight:750}h1{font-size:clamp(34px,7vw,54px);margin:10px 0 4px;letter-spacing:.09em;font-weight:780;background:linear-gradient(110deg,#fff,#d7c5ff 55%,#9baeff);background-clip:text;color:transparent}.sub{font-size:13px;color:#948ba9;margin:0}.stage{position:relative;height:340px;display:grid;place-items:center;isolation:isolate}.halo{position:absolute;width:310px;height:310px;border-radius:50%;background:radial-gradient(circle,#8053f02a 0%,#6e46e017 38%,transparent 69%);filter:blur(7px);animation:breathe 4s ease-in-out infinite}.ring{position:absolute;width:280px;height:280px;border:1px solid #c2a4ff13;border-radius:50%;box-shadow:0 0 38px #8059fc12}.ring:after{content:"";position:absolute;inset:16px;border:1px dashed #b8a0ff16;border-radius:50%}.floor{position:absolute;bottom:24px;width:230px;height:20px;background:#9567ff80;filter:blur(24px);border-radius:50%}canvas{position:relative;width:min(100%,340px);height:340px;filter:drop-shadow(0 0 28px #9065ff80);cursor:pointer;touch-action:manipulation}.result{min-height:95px;display:grid;align-content:center;gap:8px}.label{font-size:10px;letter-spacing:.28em;color:#a99abc;font-weight:750}.answer{font-size:clamp(23px,5vw,34px);font-weight:750;letter-spacing:-.025em;text-shadow:0 0 28px #aa7fff6b;overflow-wrap:anywhere}.answer.reveal{animation:reveal .55s cubic-bezier(.16,1,.3,1) both}.action{appearance:none;border:1px solid #d9b8ff8c;border-radius:16px;padding:16px 34px;background:linear-gradient(135deg,#b08aff,#7750d8 62%,#6044bf);color:white;font:750 15px inherit;letter-spacing:.08em;cursor:pointer;box-shadow:0 8px 34px #7e4de457,inset 0 1px 1px #fff8;transition:transform .2s,filter .2s;min-width:235px}.action:hover{transform:translateY(-2px);filter:brightness(1.1)}.action:active{transform:translateY(1px)}.action:disabled{opacity:.7;cursor:wait}.foot{color:#80768f;font-size:12px;margin:16px 0 30px}details{text-align:left;border:1px solid #c8aaff28;background:#ffffff06;border-radius:18px;overflow:hidden}summary{padding:17px 20px;cursor:pointer;font-size:13px;color:#cfc0e7;font-weight:650;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:'＋';float:right;color:#bda6e9}details[open] summary:after{content:'−'}.editor{padding:0 20px 20px}.hint{color:#8e83a4;font-size:12px;margin:0 0 12px}textarea{width:100%;min-height:140px;resize:vertical;background:#0b0c1a;border:1px solid #b69bfa50;border-radius:12px;padding:13px;color:#f5efff;font:14px/1.7 inherit;outline:none}textarea:focus{border-color:#b89aff}.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}.count{font-size:12px;color:#a99bbb}.save{border:1px solid #aa8cff80;background:#342452;color:#e7d9ff;padding:10px 18px;border-radius:10px;font-weight:650;cursor:pointer}.save:hover{background:#493269}.toast{min-height:18px;color:#bca9e7;font-size:12px;margin-top:8px}@keyframes breathe{50%{transform:scale(1.15);opacity:.7}}@keyframes reveal{from{opacity:0;transform:translateY(14px) scale(.96);filter:blur(7px)}to{opacity:1;transform:none;filter:blur(0)}}@media(prefers-reduced-motion:reduce){.halo{animation:none}}
</style></head><body><div class="stars"></div><main><header><div class="eyebrow">THE RANDOM ORACLE</div><h1>AURORA D20</h1><p class="sub">Кристалл случайных решений</p></header><div class="stage"><div class="halo" id="haloColor"></div><div class="ring"></div><div class="floor" id="floorColor"></div><canvas id="dice" width="680" height="680" role="img" aria-label="Трёхмерный светящийся двадцатигранный кубик. Нажмите, чтобы бросить."></canvas></div><div class="result" aria-live="polite"><div class="label" id="resultLabel">КРИСТАЛЛ ЖДЁТ РЕШЕНИЯ</div><div class="answer" id="answer">Брось кубик</div></div><button class="action" id="roll">✦ &nbsp; БРОСИТЬ D20</button><p class="foot" id="odds">4 варианта · равные шансы</p><details><summary>Настроить варианты ответов</summary><div class="editor"><p class="hint">Каждый вариант — с новой строки. Новые варианты становятся общими для всех. Удалять варианты можно в Google Таблице.</p><div id="existing" class="hint"></div><textarea id="options" spellcheck="false" placeholder="Новый вариант ответа"></textarea><div class="tools"><span class="count" id="count"></span><button class="save" id="save">Добавить вариант</button></div><div class="toast" id="toast" aria-live="polite"></div></div></details></main><script>
(()=>{'use strict';const defaults=['Своя компания','Яндекс.Лавка','Самокат','Яблоко'];
const API_URL = 'https://script.google.com/macros/s/AKfycbxgR-JXeurDl37UGCK3xPWcZA4JTLHt373nzgC4_EtQ7wNbzKE7aKYbF4qOq6KYom6B/exec';
let choices=defaults.slice();const $=id=>document.getElementById(id),canvas=$('dice'),ctx=canvas.getContext('2d'),textarea=$('options'),rollBtn=$('roll');
function refresh(){const n=choices.length;$('odds').textContent=n+' вариантов · равные шансы';$('count').textContent=n+' вариантов';$('existing').textContent='Сейчас в общем списке: '+choices.join(' · ')}
refresh();
let pending=false;
function loadChoices(){return new Promise((resolve,reject)=>{
 if(!API_URL.startsWith('https://script.google.com/macros/s/')){reject(new Error('Укажи адрес Apps Script в HTML'));return;}
 const name='oracleCb'+Math.random().toString(36).slice(2);const script=document.createElement('script');
 const timer=setTimeout(()=>finish(new Error('Не удалось загрузить ответы')),12000);
 function finish(err,data){clearTimeout(timer);delete window[name];script.remove();err?reject(err):resolve(data)}
 window[name]=data=>{if(!data.ok||!Array.isArray(data.choices))return finish(new Error('Ошибка данных'));choices=data.choices.map(x=>x.text).filter(Boolean);refresh();finish(null,data)};
 script.onerror=()=>finish(new Error('Ошибка соединения'));script.src=API_URL+'?callback='+name+'&t='+Date.now();document.head.appendChild(script);
})}
loadChoices().catch(e=>$('toast').textContent=e.message);
$('save').onclick=async()=>{
 const value=textarea.value.trim();if(!value||value.length>120||value.includes('\n')){$('toast').textContent='Введи один вариант длиной до 120 символов';return}
 if(pending)return;pending=true;$('save').disabled=true;$('toast').textContent='Добавляем в общий список…';
 const iframe=document.createElement('iframe');iframe.name='oraclePost'+Date.now();iframe.hidden=true;document.body.appendChild(iframe);
 const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target=iframe.name;form.hidden=true;
 for(const [key,val] of Object.entries({action:'add',text:value})){const inp=document.createElement('input');inp.name=key;inp.value=val;form.appendChild(inp)}document.body.appendChild(form);
 form.submit();form.remove();
 let found=false;
 for(let i=0;i<8;i++){await new Promise(r=>setTimeout(r,1400));try{await loadChoices();if(choices.some(x=>x.toLocaleLowerCase('ru')===value.toLocaleLowerCase('ru'))){found=true;break}}catch(e){}}
 iframe.remove();pending=false;$('save').disabled=false;
 if(found){textarea.value='';$('toast').textContent='✓ Вариант доступен всем'}else{$('toast').textContent='Не удалось подтвердить добавление. Проверь таблицу и настройки доступа Apps Script.'}
};
// True icosahedron: 12 vertices, 20 triangular faces.
const phi=(1+Math.sqrt(5))/2;const raw=[[-1,phi,0],[1,phi,0],[-1,-phi,0],[1,-phi,0],[0,-1,phi],[0,1,phi],[0,-1,-phi],[0,1,-phi],[phi,0,-1],[phi,0,1],[-phi,0,-1],[-phi,0,1]];const norm=Math.hypot(1,phi);const verts=raw.map(v=>v.map(x=>x/norm));const faces=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];let ax=.35,ay=.2,az=.08,spinStart=0,spinning=false,last=0,number=20;function rotate(v){let [x,y,z]=v;let c=Math.cos(ax),s=Math.sin(ax);[y,z]=[y*c-z*s,y*s+z*c];c=Math.cos(ay);s=Math.sin(ay);[x,z]=[x*c+z*s,-x*s+z*c];c=Math.cos(az);s=Math.sin(az);[x,y]=[x*c-y*s,x*s+y*c];return[x,y,z]}function project(v){const d=3.7/(3.7-v[2]);return[340+v[0]*235*d,340+v[1]*235*d]}function draw(t){const dt=Math.min(50,t-(last||t));last=t;if(spinning){let p=Math.min(1,(t-spinStart)/2100),speed=(1-p)**2*0.17+.002;ax+=speed*1.18*(dt/16);ay+=speed*1.6*(dt/16);az+=speed*.34*(dt/16);if(p>=1){spinning=false;rollBtn.disabled=false;rollBtn.textContent='✦   БРОСИТЬ ЕЩЁ';$('resultLabel').textContent='ТВОЙ РЕЗУЛЬТАТ';const el=$('answer');el.textContent=choices[pick(choices.length)];el.classList.remove('reveal');void el.offsetWidth;el.classList.add('reveal')}}else{ay+=dt*.00014;ax+=dt*.00009}ctx.clearRect(0,0,680,680);const rotated=verts.map(rotate),points=rotated.map(project);const sorted=faces.map((f,i)=>({f,i,z:f.reduce((a,k)=>a+rotated[k][2],0)/3})).sort((a,b)=>a.z-b.z);for(const {f,i,z} of sorted){const p=f.map(k=>points[k]);ctx.beginPath();ctx.moveTo(...p[0]);ctx.lineTo(...p[1]);ctx.lineTo(...p[2]);ctx.closePath();const front=Math.max(0,z);const grad=ctx.createLinearGradient(p[0][0],p[0][1],p[2][0],p[2][1]);grad.addColorStop(0,`rgba(205,180,255,${.10+front*.19})`);grad.addColorStop(.5,`rgba(111,81,222,${.12+front*.21})`);grad.addColorStop(1,`rgba(68,192,246,${.06+front*.13})`);ctx.fillStyle=grad;ctx.fill();ctx.lineWidth=z>0?2.5:1.1;ctx.strokeStyle=z>0?'rgba(212,186,255,.86)':'rgba(146,112,230,.30)';ctx.shadowBlur=z>0?14:4;ctx.shadowColor='#ae80ff';ctx.stroke();ctx.shadowBlur=0;if(z>.20){const cx=(p[0][0]+p[1][0]+p[2][0])/3,cy=(p[0][1]+p[1][1]+p[2][1])/3;ctx.save();ctx.globalAlpha=Math.min(.7,(z-.2)*.9);ctx.fillStyle='#f7eaff';ctx.font='600 22px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),cx,cy);ctx.restore()}}const glow=ctx.createRadialGradient(340,340,15,340,340,230);glow.addColorStop(0,'rgba(214,175,255,.09)');glow.addColorStop(1,'rgba(140,100,255,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(340,340,230,0,Math.PI*2);ctx.fill();requestAnimationFrame(draw)}function pick(n){if(n===1)return 0;const max=4294967296,limit=Math.floor(max/n)*n;const a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}function recolor(){const hue=Math.floor(Math.random()*360);canvas.style.filter=`hue-rotate(${hue}deg) drop-shadow(0 0 28px hsl(${(hue+260)%360} 95% 65% / .6))`;$('haloColor').style.filter=`hue-rotate(${hue}deg)`;$('floorColor').style.filter=`hue-rotate(${hue}deg)`}recolor();setInterval(()=>{if(!pending)loadChoices().catch(()=>{})},30000);function roll(){if(spinning||!choices.length)return;recolor();spinning=true;spinStart=performance.now();rollBtn.disabled=true;rollBtn.textContent='✧   КРИСТАЛЛ ВРАЩАЕТСЯ';$('resultLabel').textContent='СУДЬБА ВЫБИРАЕТ';$('answer').textContent='···';$('answer').classList.remove('reveal')}rollBtn.onclick=roll;canvas.onclick=roll;requestAnimationFrame(draw)})();
</script></body></html>
